limit_req_zone $binary_remote_addr zone=mc_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=mc_rest:10m rate=20r/s;

resolver 127.0.0.11 valid=10s ipv6=off;

upstream mc_api_upstream {
    zone mc_api_upstream 64k;
    server mc-api:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name ${MC_DOMAIN};

    location = /nginx-health {
        return 200 "ok";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${MC_DOMAIN};

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    limit_req_status 429;
    client_max_body_size 20m;

    proxy_set_header Connection "";
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/${MC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MC_DOMAIN}/privkey.pem;

    include /etc/nginx/snippets/mc-locations.conf;
}
