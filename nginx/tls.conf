server {
    listen 80;
    server_name ${MC_DOMAIN};

    location = /nginx-health {
        return 200 "ok";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${MC_DOMAIN};

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    ssl_certificate /etc/letsencrypt/live/${MC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${MC_DOMAIN}/privkey.pem;

    include /etc/nginx/snippets/mc-locations.conf;
}
